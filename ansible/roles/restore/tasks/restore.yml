---
# Restore only the requested source into fresh privately guarded staging.
- name: Restore | Normalize include/exclude to lists
  ansible.builtin.set_fact:
    _includes: >-
      {{ restore_includes if (restore_includes is sequence and restore_includes is not string)
         else ((restore_includes | default('[]')) | from_yaml | default([], true)) }}
    _excludes: >-
      {{ restore_excludes if (restore_excludes is sequence and restore_excludes is not string)
         else ((restore_excludes | default('[]')) | from_yaml | default([], true)) }}

- name: Restore | Install private restore helper
  ansible.builtin.copy:
    src: restore_snapshot.py
    dest: /etc/vff-backup/restore_snapshot.py
    owner: root
    group: root
    mode: "0700"

- name: Restore | Select and restore exact source
  no_log: true
  ansible.builtin.command:
    argv:
      - /usr/bin/python3
      - /etc/vff-backup/restore_snapshot.py
    stdin: >-
      {{ {'target': restore_target | trim,
          'force': restore_force | bool,
          'snapshot': snapshot_id | trim,
          'newest': snapshot_newest | bool,
          'tag': snapshot_tag | trim,
          'host': snapshot_host | trim,
          'includes': _includes, 'excludes': _excludes} | to_json }}
  environment:
    RESTIC_REPOSITORY: "{{ restic_repository }}"
    RESTIC_PASSWORD: "{{ restic_password }}"
    AWS_ACCESS_KEY_ID: "{{ minio_user }}"
    AWS_SECRET_ACCESS_KEY: "{{ minio_secret }}"
    AWS_DEFAULT_REGION: "{{ s3_region }}"
    RESTIC_S3_ENDPOINT: "{{ s3_endpoint }}"
    RESTIC_CACHE_DIR: "{{ restic_cache_dir }}"
  register: restore_cmd
  changed_when: true

- name: Restore | Show successful restore receipt
  ansible.builtin.debug:
    msg: "{{ restore_cmd.stdout | from_json }}"
